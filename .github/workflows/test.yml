name: Test interactive fingerprint
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/fingerprint.test.cjs
      - run: node --test automation/scheduler/scheduler.test.mjs
      - name: Install scheduler runtime test dependencies
        run: npm ci --ignore-scripts --prefix automation/scheduler
      - name: Test scheduler in Cloudflare workerd
        run: npm run test:runtime --prefix automation/scheduler
